[project]
name = "cckit"
version = "0.1.0"
description = "Claude Agent Builder — build multi-agent systems on Claude CLI"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.130",
    # Pinned: the bridge monkey-patches LiteLLM adapter internals
    # (cckit/_engine/_patches/). Those patches bind to private methods whose
    # signatures drift between releases — 1.96.2, for one, adds
    # polyfill_result / is_async to
    # translate_completion_output_params_streaming, which _stream_patch's
    # **kw would silently swallow. Re-validate every patch in _patches/
    # before moving this pin.
    "litellm==1.82.6",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-gitlab>=4.0.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "hatchling>=1.29.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cckit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
